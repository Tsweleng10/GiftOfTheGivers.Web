trigger:
- main
- Testing
- functions-prototype

pool:
  vmImage: 'windows-latest'

steps:
- task: UseDotNet@2
  displayName: 'Install .NET 8'
  inputs:
    packageType: 'sdk'
    version: '8.x'

- script: dotnet restore **/*.csproj
  displayName: 'Restore Dependencies'

- script: dotnet build **/*.csproj --configuration Release --no-restore
  displayName: 'Build Projects'

- script: dotnet test **/*Tests/*.csproj --configuration Release --no-build --filter "FullyQualifiedName!~Selenium"
  displayName: 'Run Tests'