trigger:
- main
- Testing
- functions-prototype

pool:
  vmImage: 'windows-latest'

steps:
# 1. Install .NET 8
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

# 2. Restore dependencies
- task: DotNetCoreCLI@2
  displayName: 'Restore Dependencies'
  inputs:
    command: 'restore'
    projects: '**/*.sln'

# 3. Build the project
- task: DotNetCoreCLI@2
  displayName: 'Build Solution'
  inputs:
    command: 'build'
    projects: '**/*.sln'
    arguments: '--configuration Release'

# 4. Run the Tests (Skipping Selenium)
- task: DotNetCoreCLI@2
  displayName: 'Run Unit and Integration Tests'
  inputs:
    command: 'test'
    projects: '**/*Tests/*.csproj'
    arguments: '--configuration Release --filter "FullyQualifiedName!~Selenium"'